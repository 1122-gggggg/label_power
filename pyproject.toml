[project]
name = "label-power"
version = "1.0.0"
description = "Explicit-review desktop YOLO annotation for power equipment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
